<section>
    {% for name in site.data.bio %}
    <details>
        <summary class="text-center text-error">{{ name.name }}</summary>
        <div class="bio-gallery">
            {% for item in name.items %}
            {% if name.ratio == 'square' %}
            <div class="bio-item" style="aspect-ratio: 1/1; overflow: visible;">
                <a href="{{ item.url }}" target="_blank" aria-label="{{ name.name }} link-in-bio">
                    <img class="bio-img text-center" src="{{ item.image }}" style="width: 100%; height: 100%; object-fit: contain;"
                        alt="{{ name.name }} post"></a>
            </div>
            {% elsif name.ratio == 'horizontal' %}
            <div class="bio-item" style="aspect-ratio: auto; overflow: visible;">
                <a href="{{ item.url }}" target="_blank" aria-label="{{ name.name }} link-in-bio">
                    <img class="bio-img text-center" src="{{ item.image }}" style="width: 100%; height: auto; object-fit: contain;"
                        alt="{{ name.name }} post"></a>
            </div>
            {% else %}
            <div class="bio-item" style="overflow: visible;">
                <a href="{{ item.url }}" target="_blank" aria-label="{{ name.name }} link-in-bio">
                    <img class="bio-img text-center" src="{{ item.image }}" style="width: 100%; height: auto; object-fit: contain;"
                        alt="{{ name.name }} post"></a>
            </div>
            {% endif %}
            {% endfor %}
        </div>
    </details>
    {% endfor %}
</section>
