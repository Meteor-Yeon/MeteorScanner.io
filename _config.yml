# Jekyll 설정
theme: linkhub-jekyll-theme

# 사이트 기본 설정
name: MeteorScanner # 웹사이트 이름
tagline: MeteorScanner Notice # 페이지 상단에 표시될 부제목
description: 주민등록번호 추적 프로그램 Meteor Scanner # 메타 설명 (SEO용)
favicon:
  path: https://avatars.githubusercontent.com/u/352468577?v=4 # 파비콘 이미지 경로 / URL (예: 'assets/images/favicon.png')
  type: png # 이미지 파일 형식. 지원되는 형식: https://developer.mozilla.org/en-US/docs/Web/Media/Formats/Image_types
logo: https://avatars.githubusercontent.com/u/352468577?v=4 # 프로필 로고 이미지 URL (적용 완료)
url: https://meteor-yeon.github.io/MeteorScanner.io # 웹사이트 주소
locale: ko_KR # 언어 및 지역 설정 (한국어)
ga4: # Google Analytics 4 측정 ID (예: G-XXXXXXX, 선택 사항). 필요 없으면 비워두세요.
twitter:
  username: UserName # SEO(검색엔진 최적화)용 트위터 사용자명
image:
  path: assets/images/example.jpg # SEO용 대표 이미지 (og:image, twitter:image)
  type: jpeg # 이미지 파일 형식
  height: 100 # 픽셀
  width: 100
  alt: logo

# 인증 배지 설정
badge:
  enable: true # 배지 사용 여부 ('true' 또는 'false')
  icon: ri:verified-badge-fill  # Iconify Design에서 가져올 배지 아이콘 이름 (https://icon-sets.iconify.design/)
  color: '#dfb221'  # 배지 색상 설정
  
# 기본 레이아웃 설정
defaults:
  -
    scope:
      path: ""
    values:
      layout:    "default"    

# 제외할 파일 목록
exclude: [README.md, Gemfile.lock, .jekyll-cache/, .github/, CHANGELOG.md, Gemfile, LICENSE.txt, funding.yml, linkhub-jekyll-theme.gemspec]
